<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учебный 3D-терминал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; overflow: hidden; background: #030308; font-family: monospace; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Экран выбора робота */
        #loader-screen {
            position: fixed; inset: 0; background: #050508; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #e8c87a;
        }
        #loader-screen h2 { margin-bottom: 20px; font-weight: normal; }
        #loader-screen input {
            padding: 10px; width: 280px; background: #000; border: 1px solid #e8c87a;
            color: #e8c87a; font-family: monospace; margin-bottom: 10px; text-align: center;
        }
        #loader-screen button {
            padding: 10px 20px; background: #4a2e15; border: 1px solid #e8c87a;
            color: #e8c87a; cursor: pointer; font-family: monospace;
        }

        #ui-panel {
            position: absolute; bottom: 12px; left: 12px; right: 12px; max-width: 380px;
            background: rgba(10, 10, 16, 0.94); border: 1px solid #9b7bb8;
            padding: 12px 14px; border-radius: 10px; color: #e8c87a; z-index: 10;
        }
        @media (min-width: 700px) {
            #ui-panel { top: 14px; bottom: auto; right: auto; width: 360px; }
        }
        h3 { margin: 0 0 4px 0; font-size: 14px; opacity: 0.9; }
        input[type="text"] {
            width: 100%; margin-top: 6px; padding: 9px 11px; background: #000; color: #e8c87a;
            border: 1px solid #e8c87a55; border-radius: 6px; font-family: monospace; font-size: 13px;
        }
        button { width: 100%; margin-top: 7px; padding: 9px; background: #3d2410; color: #e8c87a;
            border: 1px solid #e8c87a; border-radius: 6px; font-family: monospace; cursor: pointer; font-size: 13px; }
        button:active { background: #5a3518; }
        #console-log { margin-top: 9px; font-size: 11.5px; height: 95px; overflow-y: auto; color: #999;
            border-top: 1px solid #333; padding-top: 7px; line-height: 1.4; }
        .hint { font-size: 10.5px; opacity: 0.45; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Экран загрузки/создания робота -->
    <div id="loader-screen">
        <h2>Инициализация ядра</h2>
        <input type="text" id="robotNameInput" placeholder="Имя вашего робота">
        <button onclick="initRobot()">Запустить</button>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h3>Учебный терминал</h3>
        <input type="text" id="commandInput" placeholder="пиши код...">
        <button id="runBtn">Выполнить</button>
        <div class="hint">Пример: cube.rotation.y += 0.5 или saveState()</div>
        <div id="console-log">> Ожидание команд...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkMWBSQ5-1aJEwmf5ijETE0P0ulE_UOwc",
            authDomain: "contour-5d72a.firebaseapp.com",
            databaseURL: "https://contour-5d72a-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "contour-5d72a",
            storageBucket: "contour-5d72a.firebasestorage.app",
            messagingSenderId: "386084173741",
            appId: "1:386084173741:web:919c2ebe2c1789d9735324"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUser = null;
        let currentRobotId = "";
        let isRobotReady = false;

        // Ждем авторизации
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "Login.html";
            currentUser = user;
            log("Пользователь: " + user.email);
            document.getElementById('loader-screen').style.display = 'flex';
        });

        // ========== СЦЕНА ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.Fog(0x020208, 12, 40);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2.8, 2.4, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 1.5;
        controls.maxDistance = 15;
        controls.target.set(0, 0.5, 0);

        scene.add(new THREE.AmbientLight(0x404060, 1.2));
        const key = new THREE.DirectionalLight(0xffffff, 1.2);
        key.position.set(3, 5, 4);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0x8877aa, 0.4);
        fill.position.set(-3, 2, -2);
        scene.add(fill);
        scene.add(new THREE.GridHelper(10, 10, 0x3a3a55, 0x1a1a2a));

        const mat = new THREE.MeshStandardMaterial({ color: 0xb0b0b0, metalness: 0.25, roughness: 0.65, flatShading: true });
        const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
        cube.position.y = 0.5;
        scene.add(cube);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ========== ЛОГИКА РОБОТА ==========
        
        // Вызывается при нажатии кнопки в Loader
        window.initRobot = async function() {
            const nameInput = document.getElementById('robotNameInput').value.trim();
            if (!nameInput) return alert("Введите имя робота!");
            
            currentRobotId = nameInput.replace(/[^a-zA-Z0-9а-яА-Я_]/g, ''); // Очистка имени
            
            document.getElementById('loader-screen').style.display = 'none';
            isRobotReady = true;
            
            log(`Загрузка робота: ${nameInput}...`);
            
            // Путь к сохранению в Firebase
            const robotRef = ref(db, `users/${currentUser.uid}/robots/${currentRobotId}`);
            
            try {
                const snapshot = await get(robotRef);
                if (snapshot.exists()) {
                    // Робот существует! Загружаем данные
                    const data = snapshot.val();
                    cube.geometry.dispose();
                    
                    // Восстанавливаем форму (упрощенно)
                    if (data.shape === 'sphere') cube.geometry = new THREE.SphereGeometry(0.5, 32, 32);
                    else if (data.shape === 'cylinder') cube.geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
                    else cube.geometry = new THREE.BoxGeometry(1, 1, 1);
                    
                    // Восстанавливаем цвет
                    if (data.color) mat.color.setHex(data.color);
                    
                    log("✅ Данные робота загружены из Firebase.");
                } else {
                    log("✨ Создан новый робот. Изменения будут сохраняться.");
                }
            } catch (e) {
                log("Ошибка Firebase: " + e.message);
            }
        };

        // Функция сохранения (доступна из терминала)
        window.saveState = async function() {
            if (!currentUser || !currentRobotId) {
                return "Сначала задайте имя робота!";
            }
            
            // Определяем текущую форму
            let shape = 'box';
            if (cube.geometry.type === 'SphereGeometry') shape = 'sphere';
            if (cube.geometry.type === 'CylinderGeometry') shape = 'cylinder';
            
            const dataToSave = {
                shape: shape,
                color: mat.color.getHex(),
                posX: cube.position.x,
                posY: cube.position.y,
                posZ: cube.position.z
            };
            
            try {
                await set(ref(db, `users/${currentUser.uid}/robots/${currentRobotId}`), dataToSave);
                return "✅ Состояние сохранено в Firebase!";
            } catch (e) {
                return "❌ Ошибка сохранения: " + e.message;
            }
        };

        // ========== ТЕРМИНАЛ ==========
        function log(msg) {
            const el = document.getElementById('console-log');
            el.innerHTML += `<br>> ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        // Делаем переменные доступными в терминале
        window.cube = cube;
        window.mat = mat;
        window.scene = scene;
        window.camera = camera;
        window.controls = controls;
        window.THREE = THREE;
        window.db = db;
        window.ref = ref;
        window.get = get;
        window.set = set;

        function setFeedback(success) {
            if (success) mat.color.setHex(0x66bb66);
            else mat.color.setHex(0xcc5555);
            setTimeout(() => { if (!isRobotReady) mat.color.setHex(0xb0b0b0); }, 900);
        }

        function executeCommand() {
            const input = document.getElementById('commandInput');
            const cmd = input.value.trim();
            if (!cmd) return;

            log(`> ${cmd}`);
            try {
                const result = eval(cmd);
                setFeedback(true);
                if (result !== undefined) log(String(result));
            } catch (err) {
                setFeedback(false);
                log(`Ошибка: ${err.message}`);
            }
            input.value = '';
        }

        document.getElementById('runBtn').onclick = executeCommand;
        document.getElementById('commandInput').onkeypress = (e) => {
            if (e.key === 'Enter') executeCommand();
        };

        log("Терминал готов.");
        log("Введи имя и нажми 'Запустить'.");
    </script>
</body>
</html>
